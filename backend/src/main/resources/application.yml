spring:
  application:
    name: horrorpond
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

curation:
  auto-exposure:
    # 수집된 공포게임(CANDIDATE) 자동 노출: 출시 예정작은 바로, 출시 후 new-release-days일 동안은 리뷰와 상관없이,
    # 그 뒤로는 Steam 리뷰가 min-reviews개 이상일 때 노출한다
    min-reviews: 10
    new-release-days: 10

ingestion:
  # ShedLock 락 유지 시간. SchedulingConfig(@EnableSchedulerLock)와 수동 트리거가 함께 쓴다
  lock-at-most-for: PT2H

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/horrorpond
    username: horrorpond
    password: horrorpond

---
# 운영. DB 접속 정보와 비밀값은 환경변수로만 받는다(SPRING_DATASOURCE_URL/USERNAME/PASSWORD, ADMIN_API_KEY).
spring:
  config:
    activate:
      on-profile: prod
server:
  # Caddy(리버스 프록시) 뒤에서 X-Forwarded-* 헤더를 신뢰한다
  forward-headers-strategy: framework

---
spring:
  config:
    activate:
      on-profile: test
ingestion:
  scheduler:
    enabled: false
