spring:
  application:
    name: horrorpond
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/horrorpond
    username: horrorpond
    password: horrorpond

---
spring:
  config:
    activate:
      on-profile: test
ingestion:
  scheduler:
    enabled: false
