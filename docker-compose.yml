services:
  postgres:
    image: postgres:16
    container_name: horrorpond-postgres
    environment:
      POSTGRES_DB: horrorpond
      POSTGRES_USER: horrorpond
      POSTGRES_PASSWORD: horrorpond
    ports:
      - "5432:5432"
    volumes:
      - horrorpond-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horrorpond -d horrorpond"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  horrorpond-pgdata:
